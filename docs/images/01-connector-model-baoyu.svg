<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. regions -->
  <rect x="40" y="90" width="240" height="400" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="52" y="106" fill="#22d3ee" font-size="9" font-weight="600">AI 客户端 · 谁来调用</text>
  <rect x="360" y="90" width="240" height="400" rx="12" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="372" y="106" fill="#fb923c" font-size="9" font-weight="600">MCP 协议 · 怎么说话</text>
  <rect x="680" y="90" width="460" height="400" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="692" y="106" fill="#34d399" font-size="9" font-weight="600">你的服务 · 被调用的一方</text>

  <!-- 3. connectors -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M 264,150 L 300,150"/>
    <path d="M 264,250 L 300,250"/>
    <path d="M 264,350 L 300,350"/>
    <path d="M 264,450 L 300,450"/>
    <path d="M 300,150 L 300,450"/>
    <path d="M 924,270 L 950,270"/>
    <path d="M 950,215 L 950,415"/>
    <path d="M 950,215 L 976,215" marker-end="url(#arrow)"/>
    <path d="M 950,315 L 976,315" marker-end="url(#arrow)"/>
    <path d="M 950,415 L 976,415" marker-end="url(#arrow)"/>
  </g>
  <path d="M 300,300 L 356,300" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 604,300 L 696,300" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="308" y="200" fill="#94a3b8" font-size="8">多个客户端</text>
  <text x="308" y="212" fill="#94a3b8" font-size="8">同一协议</text>
  <text x="650" y="292" fill="#94a3b8" font-size="8" text-anchor="middle">一次实现</text>

  <!-- 4+5+6. clients (mask + box + labels) -->
  <g>
    <rect x="60" y="120" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="60" y="120" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="160" y="144" fill="white" font-size="11" font-weight="600" text-anchor="middle">ChatGPT / Codex</text>
    <text x="160" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">Apps &amp; Connectors · Plugins</text>

    <rect x="60" y="220" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="60" y="220" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="160" y="244" fill="white" font-size="11" font-weight="600" text-anchor="middle">Claude / Cowork</text>
    <text x="160" y="260" fill="#94a3b8" font-size="9" text-anchor="middle">Connectors 目录 + 自定义</text>

    <rect x="60" y="320" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="60" y="320" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="160" y="344" fill="white" font-size="11" font-weight="600" text-anchor="middle">Grok</text>
    <text x="160" y="360" fill="#94a3b8" font-size="9" text-anchor="middle">Marketplace + Bring Your Own MCP</text>

    <rect x="60" y="420" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="60" y="420" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="160" y="444" fill="white" font-size="11" font-weight="600" text-anchor="middle">Claude Code / IDE</text>
    <text x="160" y="460" fill="#94a3b8" font-size="9" text-anchor="middle">.mcp.json · config.toml</text>
  </g>

  <!-- MCP protocol elements -->
  <g>
    <rect x="380" y="120" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="380" y="120" width="200" height="60" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="480" y="144" fill="white" font-size="11" font-weight="600" text-anchor="middle">tools</text>
    <text x="480" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">名字 · 参数 · description</text>

    <rect x="380" y="220" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="380" y="220" width="200" height="60" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="480" y="244" fill="white" font-size="11" font-weight="600" text-anchor="middle">annotations</text>
    <text x="480" y="260" fill="#94a3b8" font-size="9" text-anchor="middle">readOnlyHint 等读写标注</text>

    <rect x="380" y="320" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="380" y="320" width="200" height="60" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="480" y="344" fill="white" font-size="11" font-weight="600" text-anchor="middle">传输</text>
    <text x="480" y="360" fill="#94a3b8" font-size="9" text-anchor="middle">stdio 本地 · Streamable HTTP 远程</text>

    <rect x="380" y="420" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="380" y="420" width="200" height="60" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="480" y="444" fill="white" font-size="11" font-weight="600" text-anchor="middle">鉴权</text>
    <text x="480" y="460" fill="#94a3b8" font-size="9" text-anchor="middle">OAuth · bearer token</text>
  </g>

  <!-- MCP server -->
  <rect x="700" y="230" width="220" height="80" rx="6" fill="#0f172a"/>
  <rect x="700" y="230" width="220" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="810" y="258" fill="white" font-size="12" font-weight="600" text-anchor="middle">你的 MCP server</text>
  <text x="810" y="276" fill="#94a3b8" font-size="9" text-anchor="middle">一个进程或一个 HTTPS 端点</text>
  <text x="810" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">把业务操作声明成 tools · 这就是 connector</text>

  <!-- internal systems as cylinders -->
  <g transform="translate(980,180)">
    <rect x="0" y="10" width="120" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="#0f172a"/>
    <ellipse cx="60" cy="60" rx="60" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="60" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">工单系统</text>
  </g>
  <g transform="translate(980,280)">
    <rect x="0" y="10" width="120" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="#0f172a"/>
    <ellipse cx="60" cy="60" rx="60" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="60" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">员工目录</text>
  </g>
  <g transform="translate(980,380)">
    <rect x="0" y="10" width="120" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="#0f172a"/>
    <ellipse cx="60" cy="60" rx="60" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="60" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="10" rx="60" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">知识库</text>
  </g>

  <!-- 7. legend -->
  <g transform="translate(40,540)">
    <rect width="12" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="18" y="10" fill="#94a3b8" font-size="9">AI 客户端</text>
    <rect x="110" width="12" height="12" rx="3" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="128" y="10" fill="#94a3b8" font-size="9">MCP 协议要素</text>
    <rect x="240" width="12" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="258" y="10" fill="#94a3b8" font-size="9">MCP server（connector 本体）</text>
    <rect x="450" width="12" height="12" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="468" y="10" fill="#94a3b8" font-size="9">内部系统</text>
  </g>
  <text x="590" y="590" fill="#64748b" font-size="9" text-anchor="middle">线上客户端只接受公网 HTTPS；本机 HTTP 只有 Claude Code、Codex CLI 这类本地客户端能连</text>

  <!-- 8. title -->
  <text x="40" y="40" fill="white" font-size="16" font-weight="700">Connector 的三段结构</text>
  <text x="40" y="58" fill="#94a3b8" font-size="9">一个 connector = 一个 MCP server + 一段 client 侧配置。协议在中间，两边各自演进。</text>
</svg>
