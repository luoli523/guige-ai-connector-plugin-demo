<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Claude for Financial Advisors 的三层结构</title>
  <desc id="diagram-desc">顾问在 Cowork 里下一句指令，plugin 内的 8 个 skill 调用 23 个 connector 读取公司系统。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">Claude for Financial Advisors 的三层结构</text>
  <text class="subtitle" x="40" y="64">来源：github.com/anthropics/financial-services，claude-for-financial-advisors 目录，2026-09</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
<rect class="region" x="40" y="190" width="1120" height="410" rx="12" stroke="#fbbf24"/>
<text class="region-label" x="52" y="208" fill="#fbbf24">Plugin 层 · claude-for-financial-advisors · 装一次，下面两层都到位；另含 6 个做抽取与核对的子代理</text>
<rect class="region" x="60" y="220" width="1080" height="200" rx="10" stroke="#34d399"/>
<text class="region-label" x="72" y="238" fill="#34d399">Skill 层 · 8 套顾问工作流程，写的是"查哪些系统、按什么顺序、哪些数字要交叉核对"</text>
<rect class="region" x="60" y="440" width="1080" height="140" rx="10" stroke="#a78bfa"/>
<text class="region-label" x="72" y="458" fill="#a78bfa">Connector 层 · 23 个 MCP 连接，每个对应一家系统</text>
</g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
<path class="conn-main" d="M 600,164 L 600,186" marker-end="url(#arrow-main)"/>
<path class="conn-main" d="M 600,424 L 600,436" marker-end="url(#arrow-main)"/>
<path class="conn" d="M 600,604 L 600,626" marker-end="url(#arrow)"/>
</g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
<g transform="translate(500,100)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node primary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">理财顾问 · Cowork</text><text class="sub" x="100.0" y="44.0">「帮我准备明天和某某家的会」</text></g>
<g transform="translate(100,246)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">会前准备</text><text class="sub" x="100.0" y="44.0">pre-meeting</text></g>
<g transform="translate(360,246)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">会后跟进</text><text class="sub" x="100.0" y="44.0">post-meeting</text></g>
<g transform="translate(620,246)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">潜客接洽</text><text class="sub" x="100.0" y="44.0">prospect-intake</text></g>
<g transform="translate(880,246)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">客户开户</text><text class="sub" x="100.0" y="44.0">onboarding</text></g>
<g transform="translate(100,326)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">组合再平衡审查</text><text class="sub" x="100.0" y="44.0">portfolio-rebalance-review</text></g>
<g transform="translate(360,326)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">另类投资简报</text><text class="sub" x="100.0" y="44.0">alts-brief</text></g>
<g transform="translate(620,326)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">遗产与税务简报</text><text class="sub" x="100.0" y="44.0">estate-and-tax-brief</text></g>
<g transform="translate(880,326)"><rect class="mask" width="200" height="60" rx="6"/><rect class="node secondary" width="200" height="60" rx="6"/><text class="label" x="100.0" y="26.0">合规</text><text class="sub" x="100.0" y="44.0">compliance</text></g>
<g transform="translate(80,470)"><rect class="mask" width="330" height="80" rx="6"/><rect class="node data" width="330" height="80" rx="6"/><text class="label" x="165.0" y="24">行业系统 · 9 个</text><text class="sub" x="165.0" y="44">Orion · Wealthbox · Addepar · Tamarac</text><text class="sub" x="165.0" y="60">Salesforce · MoneyGuide · Zocks · iCapital …</text></g>
<g transform="translate(440,470)"><rect class="mask" width="330" height="80" rx="6"/><rect class="node data" width="330" height="80" rx="6"/><text class="label" x="165.0" y="24">办公工具 · 8 个</text><text class="sub" x="165.0" y="44">Gmail · Calendar · Drive · Microsoft 365</text><text class="sub" x="165.0" y="60">Box · Dropbox · Slack · Zoom</text></g>
<g transform="translate(800,470)"><rect class="mask" width="330" height="80" rx="6"/><rect class="node data" width="330" height="80" rx="6"/><text class="label" x="165.0" y="24">市场数据 · 6 个</text><text class="sub" x="165.0" y="44">Snowflake · FactSet · S&amp;P Global</text><text class="sub" x="165.0" y="60">Morningstar · BlackRock · Daloopa</text></g>
<g transform="translate(300,630)"><rect class="mask" width="600" height="44" rx="6"/><rect class="node neutral" width="600" height="44" rx="6"/><text class="label" x="300.0" y="27.0">理财顾问公司自己的系统与数据（不在 plugin 里，通过 connector 实时读取）</text></g>
</g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
<text class="caption" x="600" y="726">顾问说一句话，skill 决定查什么，connector 负责查到，plugin 把它们一起装进 Cowork</text></g>
</svg>
