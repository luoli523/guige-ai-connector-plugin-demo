<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">本项目里有什么</title>
  <desc id="diagram-desc">用户在 Claude Code 里装 servicedesk 或 servicedesk-agent 其中一个 plugin，plugin 通过 .mcp.json 连接 demo-services 下三个模拟系统。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">本项目里有什么</text>
  <text class="subtitle" x="40" y="64">一套模拟服务、两个 plugin、四个 skill、三个命令、一位 agent</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
<rect class="region" x="260" y="100" width="440" height="460" rx="12" stroke="#fbbf24"/>
<text class="region-label" x="272" y="118" fill="#fbbf24">plugins/ · 两个 plugin，装其中一个</text>
<rect class="region" x="280" y="130" width="400" height="250" rx="10" stroke="#34d399"/>
<text class="region-label" x="292" y="148" fill="#34d399">servicedesk · 一盒能力</text>
<rect class="region" x="280" y="400" width="400" height="140" rx="10" stroke="#60a5fa"/>
<text class="region-label" x="292" y="418" fill="#60a5fa">servicedesk-agent · 一位同事</text>
<rect class="region" x="760" y="100" width="400" height="460" rx="12" stroke="#a78bfa"/>
<text class="region-label" x="772" y="118" fill="#a78bfa">demo-services/ · 三个模拟系统，各是一个 MCP server</text>
</g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
<path class="conn-main" d="M 204,310 L 256,310" marker-end="url(#arrow-main)"/>
<text class="edge" x="230" y="304">装 plugin</text>
<path class="conn" d="M 704,330 L 730,330"/>
<path class="conn" d="M 730,180 L 730,440"/>
<path class="conn" d="M 730,180 L 776,180" marker-end="url(#arrow)"/>
<path class="conn" d="M 730,310 L 776,310" marker-end="url(#arrow)"/>
<path class="conn" d="M 730,440 L 776,440" marker-end="url(#arrow)"/>
</g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
<g transform="translate(40,280)"><rect class="mask" width="160" height="60" rx="6"/><rect class="node primary" width="160" height="60" rx="6"/><text class="label" x="80.0" y="26.0">你</text><text class="sub" x="80.0" y="44.0">在 Claude Code 里说一句话</text></g>
<g transform="translate(300,160)"><rect class="mask" width="180" height="44" rx="6"/><rect class="node secondary" width="180" height="44" rx="6"/><text class="label" x="90.0" y="18.0">ticket-triage</text><text class="sub" x="90.0" y="36.0">处理一张工单</text></g>
<g transform="translate(500,160)"><rect class="mask" width="180" height="44" rx="6"/><rect class="node secondary" width="180" height="44" rx="6"/><text class="label" x="90.0" y="18.0">onboarding-prep</text><text class="sub" x="90.0" y="36.0">新员工入职准备</text></g>
<g transform="translate(300,214)"><rect class="mask" width="180" height="44" rx="6"/><rect class="node secondary" width="180" height="44" rx="6"/><text class="label" x="90.0" y="18.0">faq-reply</text><text class="sub" x="90.0" y="36.0">回答员工常见问题</text></g>
<g transform="translate(500,214)"><rect class="mask" width="180" height="44" rx="6"/><rect class="node secondary" width="180" height="44" rx="6"/><text class="label" x="90.0" y="18.0">weekly-desk-report</text><text class="sub" x="90.0" y="36.0">服务台周报</text></g>
<g transform="translate(300,268)"><rect class="mask" width="380" height="44" rx="6"/><rect class="node neutral" width="380" height="44" rx="6"/><text class="label" x="190.0" y="18.0">3 个命令</text><text class="sub" x="190.0" y="36.0">/triage · /onboard · /desk-report</text></g>
<g transform="translate(300,322)"><rect class="mask" width="380" height="44" rx="6"/><rect class="node infra" width="380" height="44" rx="6"/><text class="label" x="190.0" y="18.0">.mcp.json</text><text class="sub" x="190.0" y="36.0">三个系统的地址</text></g>
<g transform="translate(300,430)"><rect class="mask" width="380" height="44" rx="6"/><rect class="node highlight" width="380" height="44" rx="6"/><text class="label" x="190.0" y="18.0">servicedesk-agent.md</text><text class="sub" x="190.0" y="36.0">角色、职责、只用这三个系统的工具</text></g>
<g transform="translate(300,484)"><rect class="mask" width="380" height="44" rx="6"/><rect class="node neutral" width="380" height="44" rx="6"/><text class="label" x="190.0" y="18.0">4 份 skill 副本 + 同一份 .mcp.json</text><text class="sub" x="190.0" y="36.0">由脚本从 servicedesk 同步</text></g>
<g transform="translate(780,140)"><rect class="mask" width="360" height="80" rx="6"/><rect class="node data" width="360" height="80" rx="6"/><text class="label" x="180.0" y="36.0">工单 · ticketing · :8001</text><text class="sub" x="180.0" y="54.0">18 张工单 · 5 个操作，其中 3 个是写</text></g>
<g transform="translate(780,270)"><rect class="mask" width="360" height="80" rx="6"/><rect class="node data" width="360" height="80" rx="6"/><text class="label" x="180.0" y="36.0">员工目录 · directory · :8002</text><text class="sub" x="180.0" y="54.0">24 名员工 · 5 个操作，全部只读</text></g>
<g transform="translate(780,400)"><rect class="mask" width="360" height="80" rx="6"/><rect class="node data" width="360" height="80" rx="6"/><text class="label" x="180.0" y="36.0">知识库 · knowledge-base · :8003</text><text class="sub" x="180.0" y="54.0">14 篇文档 · 2 个操作，全部只读</text></g>
</g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
<text class="caption" x="600" y="596">装一个 plugin，说一句话，AI 按 skill 里的流程通过三个连接读写三个系统</text></g>
</svg>
