<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">四个 skill 各调哪些 tool</title>
  <desc id="diagram-desc">按 SKILL.md 正文统计的 skill 与 tool 调用关系矩阵，区分只读调用与需先确认的写调用。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">四个 skill 各调哪些 tool</text>
  <text class="subtitle" x="40" y="64">按 SKILL.md 正文统计。写调用只在 skill 展示拟稿、用户确认后发生；weekly-desk-report 没有任何写调用。</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
  </g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
  </g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
    <g transform="translate(40,110)">
    <rect class="node neutral" width="360" height="44" rx="4"/><text class="label" x="12" y="27" style="text-anchor:start">server · tool</text>
    <rect class="node neutral" x="360" width="200" height="44" rx="4"/><text class="label" x="460" y="27">ticket-triage</text>
    <rect class="node neutral" x="560" width="200" height="44" rx="4"/><text class="label" x="660" y="27">onboarding-prep</text>
    <rect class="node neutral" x="760" width="200" height="44" rx="4"/><text class="label" x="860" y="27">faq-reply</text>
    <rect class="node neutral" x="960" width="200" height="44" rx="4"/><text class="label" x="1060" y="27">weekly-desk-report</text>
    </g>
    <g transform="translate(40,154)">
    <text class="group" x="12" y="25" fill="#fb923c">ticketing</text>
    <text class="label" x="152" y="25" style="text-anchor:start">search_tickets</text>
    <text class="label" x="460" y="26" fill="#34d399">✓</text>
    <text class="label" x="660" y="26" fill="#34d399">✓</text>
    <text class="label" x="860" y="26" fill="#475569">–</text>
    <text class="label" x="1060" y="26" fill="#34d399">✓</text>
    <line class="divider" x1="0" y1="40" x2="1160" y2="40"/>
    <text class="label" x="152" y="65" style="text-anchor:start">get_ticket</text>
    <text class="label" x="460" y="66" fill="#34d399">✓</text>
    <text class="label" x="660" y="66" fill="#475569">–</text>
    <text class="label" x="860" y="66" fill="#34d399">✓</text>
    <text class="label" x="1060" y="66" fill="#475569">–</text>
    <line class="divider" x1="0" y1="80" x2="1160" y2="80"/>
    <text class="label" x="152" y="105" style="text-anchor:start">create_ticket</text>
    <text class="label" x="460" y="106" fill="#475569">–</text>
    <rect class="node alert" x="638" y="89" width="44" height="22" rx="4"/><text class="edge" x="660" y="104" fill="#fb7185">写</text>
    <text class="label" x="860" y="106" fill="#475569">–</text>
    <text class="label" x="1060" y="106" fill="#475569">–</text>
    <line class="divider" x1="0" y1="120" x2="1160" y2="120"/>
    <text class="label" x="152" y="145" style="text-anchor:start">update_ticket_status</text>
    <rect class="node alert" x="438" y="129" width="44" height="22" rx="4"/><text class="edge" x="460" y="144" fill="#fb7185">写</text>
    <text class="label" x="660" y="146" fill="#475569">–</text>
    <text class="label" x="860" y="146" fill="#475569">–</text>
    <text class="label" x="1060" y="146" fill="#475569">–</text>
    <line class="divider" x1="0" y1="160" x2="1160" y2="160"/>
    <text class="label" x="152" y="185" style="text-anchor:start">add_comment</text>
    <rect class="node alert" x="438" y="169" width="44" height="22" rx="4"/><text class="edge" x="460" y="184" fill="#fb7185">写</text>
    <text class="label" x="660" y="186" fill="#475569">–</text>
    <rect class="node alert" x="838" y="169" width="44" height="22" rx="4"/><text class="edge" x="860" y="184" fill="#fb7185">写</text>
    <text class="label" x="1060" y="186" fill="#475569">–</text>
    <line class="divider" x1="0" y1="200" x2="1160" y2="200"/>
    <text class="group" x="12" y="225" fill="#fb923c">directory</text>
    <text class="label" x="152" y="225" style="text-anchor:start">find_employee</text>
    <text class="label" x="460" y="226" fill="#34d399">✓</text>
    <text class="label" x="660" y="226" fill="#475569">–</text>
    <text class="label" x="860" y="226" fill="#475569">–</text>
    <text class="label" x="1060" y="226" fill="#475569">–</text>
    <line class="divider" x1="0" y1="240" x2="1160" y2="240"/>
    <text class="label" x="152" y="265" style="text-anchor:start">get_manager</text>
    <text class="label" x="460" y="266" fill="#34d399">✓</text>
    <text class="label" x="660" y="266" fill="#475569">–</text>
    <text class="label" x="860" y="266" fill="#475569">–</text>
    <text class="label" x="1060" y="266" fill="#475569">–</text>
    <line class="divider" x1="0" y1="280" x2="1160" y2="280"/>
    <text class="label" x="152" y="305" style="text-anchor:start">get_team</text>
    <text class="label" x="460" y="306" fill="#475569">–</text>
    <text class="label" x="660" y="306" fill="#475569">–</text>
    <text class="label" x="860" y="306" fill="#475569">–</text>
    <text class="label" x="1060" y="306" fill="#475569">–</text>
    <line class="divider" x1="0" y1="320" x2="1160" y2="320"/>
    <text class="label" x="152" y="345" style="text-anchor:start">get_assigned_devices</text>
    <text class="label" x="460" y="346" fill="#34d399">✓</text>
    <text class="label" x="660" y="346" fill="#475569">–</text>
    <text class="label" x="860" y="346" fill="#475569">–</text>
    <text class="label" x="1060" y="346" fill="#475569">–</text>
    <line class="divider" x1="0" y1="360" x2="1160" y2="360"/>
    <text class="label" x="152" y="385" style="text-anchor:start">get_onboarding_status</text>
    <text class="label" x="460" y="386" fill="#34d399">✓</text>
    <text class="label" x="660" y="386" fill="#34d399">✓</text>
    <text class="label" x="860" y="386" fill="#475569">–</text>
    <text class="label" x="1060" y="386" fill="#475569">–</text>
    <line class="divider" x1="0" y1="400" x2="1160" y2="400"/>
    <text class="group" x="12" y="425" fill="#fb923c">knowledge-base</text>
    <text class="label" x="152" y="425" style="text-anchor:start">search_articles</text>
    <text class="label" x="460" y="426" fill="#34d399">✓</text>
    <text class="label" x="660" y="426" fill="#475569">–</text>
    <text class="label" x="860" y="426" fill="#34d399">✓</text>
    <text class="label" x="1060" y="426" fill="#34d399">✓</text>
    <line class="divider" x1="0" y1="440" x2="1160" y2="440"/>
    <text class="label" x="152" y="465" style="text-anchor:start">get_article</text>
    <text class="label" x="460" y="466" fill="#34d399">✓</text>
    <text class="label" x="660" y="466" fill="#34d399">✓</text>
    <text class="label" x="860" y="466" fill="#34d399">✓</text>
    <text class="label" x="1060" y="466" fill="#475569">–</text>
    <line class="divider" x1="0" y1="480" x2="1160" y2="480"/>
    <line class="divider" x1="360" y1="0" x2="360" y2="480"/>
    <line class="divider" x1="560" y1="0" x2="560" y2="480"/>
    <line class="divider" x1="760" y1="0" x2="760" y2="480"/>
    <line class="divider" x1="960" y1="0" x2="960" y2="480"/>
    <line class="divider" x1="1160" y1="0" x2="1160" y2="480"/>
    <line class="divider" x1="140" y1="0" x2="140" y2="480"/>
    <line class="conn" x1="0" y1="200" x2="1160" y2="200"/>
    <line class="conn" x1="0" y1="400" x2="1160" y2="400"/>
    </g>
  </g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
    <g transform="translate(40,690)">
      <text class="legend" x="0" y="11" fill="#34d399">✓  只读调用，skill 自动完成</text>
      <rect class="node alert" x="220" width="14" height="14" rx="3"/>
      <text class="legend" x="240" y="11">写调用，先展示拟稿、用户确认后才执行，一次一个</text>
      <text class="legend" x="560" y="11" fill="#475569">–  不调用。get_team 目前没有 skill 用到，tool 不必每个都对应 skill</text>
    </g>
  </g>
</svg>
