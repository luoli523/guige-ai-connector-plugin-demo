<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">以前 vs 现在：让 AI 用上你的系统</title>
  <desc id="diagram-desc">左侧：三个系统靠人或脚本分别接到四个 AI 产品；右侧：三个系统通过一个 connector 接入，四个 AI 产品共用。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">以前 vs 现在：让 AI 用上你的系统</text>
  <text class="subtitle" x="40" y="64">同样的三个系统、四个 AI 产品，中间那一段换掉了</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
<rect class="region" x="40" y="100" width="540" height="440" rx="12" stroke="#fb7185"/>
<text class="region-label" x="52" y="118" fill="#fb7185">以前</text>
<rect class="region" x="620" y="100" width="540" height="440" rx="12" stroke="#34d399"/>
<text class="region-label" x="632" y="118" fill="#34d399">现在</text>
<text class="annot" x="60" y="460">· 数据靠人搬或靠脚本拉，AI 只看到一小块，还可能过期</text>
<text class="annot" x="60" y="482">· 每个 AI 产品各接一遍，四个产品四套</text>
<text class="annot" x="60" y="504">· 接上了也不懂你们的规矩</text>
<text class="annot" x="640" y="460">· AI 直接读系统，看到的是当前数据</text>
<text class="annot" x="640" y="482">· 系统做一次插头，所有 AI 产品共用</text>
<text class="annot" x="640" y="504">· 规矩写进 skill，接在 connector 之上（第 4 节）</text>
</g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
<path class="conn-err" d="M 204,198 L 225,198"/>
<path class="conn-err" d="M 204,278 L 225,278"/>
<path class="conn-err" d="M 204,358 L 225,358"/>
<path class="conn-err" d="M 225,158 L 225,398"/>
<path class="conn-err" d="M 225,158 L 246,158" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 374,158 L 416,158" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 225,238 L 246,238" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 374,238 L 416,238" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 225,318 L 246,318" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 374,318 L 416,318" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 225,398 L 246,398" marker-end="url(#arrow-err)"/>
<path class="conn-err" d="M 374,398 L 416,398" marker-end="url(#arrow-err)"/>
<path class="conn-main" d="M 784,198 L 805,198"/>
<path class="conn-main" d="M 784,278 L 805,278"/>
<path class="conn-main" d="M 784,358 L 805,358"/>
<path class="conn-main" d="M 805,198 L 805,358"/>
<path class="conn-main" d="M 805,278 L 826,278" marker-end="url(#arrow-main)"/>
<path class="conn-main" d="M 954,278 L 975,278"/>
<path class="conn-main" d="M 975,158 L 975,398"/>
<path class="conn-main" d="M 975,158 L 996,158" marker-end="url(#arrow-main)"/>
<path class="conn-main" d="M 975,238 L 996,238" marker-end="url(#arrow-main)"/>
<path class="conn-main" d="M 975,318 L 996,318" marker-end="url(#arrow-main)"/>
<path class="conn-main" d="M 975,398 L 996,398" marker-end="url(#arrow-main)"/>
</g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
<g transform="translate(60,176)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node data" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">工单系统</text></g>
<g transform="translate(60,256)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node data" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">人事系统</text></g>
<g transform="translate(60,336)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node data" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">知识库</text></g>
<g transform="translate(420,136)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">Cowork</text></g>
<g transform="translate(420,216)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">ChatGPT</text></g>
<g transform="translate(420,296)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">Grok</text></g>
<g transform="translate(420,376)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">Gemini</text></g>
<g transform="translate(640,176)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node data" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">工单系统</text></g>
<g transform="translate(640,256)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node data" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">人事系统</text></g>
<g transform="translate(640,336)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node data" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">知识库</text></g>
<g transform="translate(1000,136)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">Cowork</text></g>
<g transform="translate(1000,216)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">ChatGPT</text></g>
<g transform="translate(1000,296)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">Grok</text></g>
<g transform="translate(1000,376)"><rect class="mask" width="140" height="44" rx="6"/><rect class="node primary" width="140" height="44" rx="6"/><text class="label" x="70.0" y="27.0">Gemini</text></g>
<g transform="translate(250,136)"><rect class="mask" width="120" height="44" rx="6"/><rect class="node alert" width="120" height="44" rx="6"/><text class="label" x="60.0" y="27.0">脚本 / 复制粘贴</text></g>
<g transform="translate(250,216)"><rect class="mask" width="120" height="44" rx="6"/><rect class="node alert" width="120" height="44" rx="6"/><text class="label" x="60.0" y="27.0">脚本 / 复制粘贴</text></g>
<g transform="translate(250,296)"><rect class="mask" width="120" height="44" rx="6"/><rect class="node alert" width="120" height="44" rx="6"/><text class="label" x="60.0" y="27.0">脚本 / 复制粘贴</text></g>
<g transform="translate(250,376)"><rect class="mask" width="120" height="44" rx="6"/><rect class="node alert" width="120" height="44" rx="6"/><text class="label" x="60.0" y="27.0">脚本 / 复制粘贴</text></g>
<g transform="translate(830,136)"><rect class="mask" width="120" height="284" rx="6"/><rect class="node secondary" width="120" height="284" rx="6"/><text class="label" x="60.0" y="138.0">Connector</text><text class="sub" x="60.0" y="156.0">MCP 标准插头</text></g>
</g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
<text class="caption" x="600" y="576">connector 把「每家接一遍」变成「接一次，处处能用」</text></g>
</svg>
