<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">plugin 里的文件，装完后在会话里叫什么</title>
  <desc id="diagram-desc">plugins/servicedesk 目录中的每类文件，经 marketplace 安装后，在 Claude Code 会话里出现的名字与前缀。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">plugin 里的文件，装完后在会话里叫什么</text>
  <text class="subtitle" x="40" y="64">安装给每样东西加了 plugin 名作命名空间。MCP tool 的前缀是 mcp__plugin_&lt;plugin&gt;_&lt;server&gt;__，agent 的 tools 字段必须写这个全名。</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
    <rect class="region" x="40" y="110" width="340" height="510" rx="12" stroke="#22d3ee"/>
    <text class="region-label" x="52" y="128" fill="#22d3ee">仓库里的文件 · plugins/servicedesk/</text>
    <rect class="region" x="460" y="110" width="240" height="510" rx="12" stroke="#94a3b8"/>
    <text class="region-label" x="472" y="128" fill="#94a3b8">安装</text>
    <rect class="region" x="760" y="110" width="500" height="510" rx="12" stroke="#60a5fa"/>
    <text class="region-label" x="772" y="128" fill="#60a5fa">用户会话里看到的名字</text>
  </g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
    <path class="conn" d="M 364,170 L 476,170"/>
    <path class="conn" d="M 684,170 L 776,170" marker-end="url(#arrow)"/>
    <path class="conn" d="M 364,270 L 476,270"/>
    <path class="conn" d="M 684,270 L 776,270" marker-end="url(#arrow)"/>
    <path class="conn" d="M 364,370 L 476,370"/>
    <path class="conn" d="M 684,370 L 776,370" marker-end="url(#arrow)"/>
    <path class="conn" d="M 364,470 L 476,470"/>
    <path class="conn" d="M 684,470 L 776,470" marker-end="url(#arrow)"/>
    <path class="conn" d="M 364,570 L 476,570"/>
    <path class="conn" d="M 684,570 L 776,570" marker-end="url(#arrow)"/>
  </g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
    <g transform="translate(60,140)">
      <rect class="mask" width="300" height="60" rx="6"/>
      <rect class="node primary" width="300" height="60" rx="6"/>
      <text class="label" x="150" y="26">plugin.json</text>
      <text class="sub" x="150" y="44">name · version · description</text>
    </g>
    <g transform="translate(780,140)">
      <rect class="mask" width="460" height="60" rx="6"/>
      <rect class="node highlight" width="460" height="60" rx="6"/>
      <text class="label" x="230" y="26">claude plugin details servicedesk</text>
      <text class="sub" x="230" y="44">Service Desk (servicedesk) 0.1.0</text>
    </g>
    <g transform="translate(60,240)">
      <rect class="mask" width="300" height="60" rx="6"/>
      <rect class="node primary" width="300" height="60" rx="6"/>
      <text class="label" x="150" y="26">.mcp.json</text>
      <text class="sub" x="150" y="44">ticketing / directory / knowledge-base</text>
    </g>
    <g transform="translate(780,240)">
      <rect class="mask" width="460" height="60" rx="6"/>
      <rect class="node highlight" width="460" height="60" rx="6"/>
      <text class="label" x="230" y="26">/mcp → plugin:servicedesk:ticketing</text>
      <text class="sub" x="230" y="44">tool: mcp__plugin_servicedesk_ticketing__get_ticket</text>
    </g>
    <g transform="translate(60,340)">
      <rect class="mask" width="300" height="60" rx="6"/>
      <rect class="node primary" width="300" height="60" rx="6"/>
      <text class="label" x="150" y="26">commands/triage.md</text>
      <text class="sub" x="150" y="44">description + $ARGUMENTS</text>
    </g>
    <g transform="translate(780,340)">
      <rect class="mask" width="460" height="60" rx="6"/>
      <rect class="node highlight" width="460" height="60" rx="6"/>
      <text class="label" x="230" y="26">/servicedesk:triage T-1042</text>
      <text class="sub" x="230" y="44">补全列表里可见</text>
    </g>
    <g transform="translate(60,440)">
      <rect class="mask" width="300" height="60" rx="6"/>
      <rect class="node primary" width="300" height="60" rx="6"/>
      <text class="label" x="150" y="26">skills/ticket-triage/SKILL.md</text>
      <text class="sub" x="150" y="44">frontmatter 常驻，正文触发后加载</text>
    </g>
    <g transform="translate(780,440)">
      <rect class="mask" width="460" height="60" rx="6"/>
      <rect class="node highlight" width="460" height="60" rx="6"/>
      <text class="label" x="230" y="26">/servicedesk:ticket-triage 或语义触发</text>
      <text class="sub" x="230" y="44">「帮我处理 T-1042」</text>
    </g>
    <g transform="translate(60,540)">
      <rect class="mask" width="300" height="60" rx="6"/>
      <rect class="node primary" width="300" height="60" rx="6"/>
      <text class="label" x="150" y="26">agents/servicedesk-agent.md</text>
      <text class="sub" x="150" y="44">仅 agent plugin；tools: mcp__plugin_…__*</text>
    </g>
    <g transform="translate(780,540)">
      <rect class="mask" width="460" height="60" rx="6"/>
      <rect class="node highlight" width="460" height="60" rx="6"/>
      <text class="label" x="230" y="26">/agents → servicedesk-agent</text>
      <text class="sub" x="230" y="44">子代理，按 tools 字段拿工具</text>
    </g>
    <g transform="translate(480,140)">
      <rect class="mask" width="200" height="460" rx="6"/>
      <rect class="node neutral" width="200" height="460" rx="6"/>
      <text class="label" x="100" y="200">marketplace.json</text>
      <text class="sub" x="100" y="220">source: ./plugins/servicedesk</text>
      <text class="label" x="100" y="260">claude plugin</text>
      <text class="label" x="100" y="278">marketplace add</text>
      <text class="label" x="100" y="296">install</text>
      <text class="sub" x="100" y="330">版本号变了才有 update</text>
    </g>
  </g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
    <g transform="translate(40,690)">
      <rect class="node primary" width="14" height="14" rx="3"/>
      <text class="legend" x="20" y="11">plugin 目录中的文件</text>
      <rect class="node neutral" x="180" width="14" height="14" rx="3"/>
      <text class="legend" x="200" y="11">安装机制</text>
      <rect class="node highlight" x="300" width="14" height="14" rx="3"/>
      <text class="legend" x="320" y="11">会话里的名字（带 servicedesk 命名空间）</text>
    </g>
    <text class="caption" x="650" y="655">最后一行只在 servicedesk-agent 里有；其余四行两个 plugin 相同，前缀里的 plugin 名随之变为 servicedesk-agent</text>
  </g>
</svg>
