<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Connector 的三段结构</title>
  <desc id="diagram-desc">AI 客户端通过 MCP 协议调用你的 MCP server，server 再访问内部系统；一次实现，多个客户端复用。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">Connector 的三段结构</text>
  <text class="subtitle" x="40" y="64">一个 connector = 一个 MCP server + 一段 client 侧配置。协议在中间，两边各自演进。</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
    <rect class="region" x="40" y="110" width="240" height="420" rx="12" stroke="#22d3ee"/>
    <text class="region-label" x="52" y="128" fill="#22d3ee">AI 客户端 · 谁来调用</text>
    <rect class="region" x="360" y="110" width="240" height="420" rx="12" stroke="#fb923c"/>
    <text class="region-label" x="372" y="128" fill="#fb923c">MCP 协议 · 怎么说话</text>
    <rect class="region" x="680" y="110" width="440" height="420" rx="12" stroke="#34d399"/>
    <text class="region-label" x="692" y="128" fill="#34d399">你的服务 · 被调用的一方</text>
  </g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
    <!-- clients -> trunk -> MCP region -->
    <path class="conn" d="M 264,170 L 300,170"/>
    <path class="conn" d="M 264,270 L 300,270"/>
    <path class="conn" d="M 264,370 L 300,370"/>
    <path class="conn" d="M 264,470 L 300,470"/>
    <path class="conn" d="M 300,170 L 300,470"/>
    <path class="conn-main" d="M 300,320 L 356,320" marker-end="url(#arrow-main)"/>
    <text class="edge" x="308" y="220" text-anchor="start">多个客户端</text>
    <text class="edge" x="308" y="234" text-anchor="start">同一协议</text>
    <!-- MCP region -> server -->
    <path class="conn-main" d="M 604,320 L 696,320" marker-end="url(#arrow-main)"/>
    <text class="edge" x="650" y="312">一次实现</text>
    <!-- server -> trunk -> systems -->
    <path class="conn" d="M 904,290 L 930,290"/>
    <path class="conn" d="M 930,235 L 930,435"/>
    <path class="conn" d="M 930,235 L 956,235" marker-end="url(#arrow)"/>
    <path class="conn" d="M 930,335 L 956,335" marker-end="url(#arrow)"/>
    <path class="conn" d="M 930,435 L 956,435" marker-end="url(#arrow)"/>
  </g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
    <g transform="translate(60,140)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node primary" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">ChatGPT / Codex</text>
      <text class="sub" x="100" y="44">Apps &amp; Connectors · Plugins</text>
    </g>
    <g transform="translate(60,240)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node primary" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">Claude / Cowork</text>
      <text class="sub" x="100" y="44">Connectors 目录 + 自定义</text>
    </g>
    <g transform="translate(60,340)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node primary" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">Grok</text>
      <text class="sub" x="100" y="44">Marketplace + Bring Your Own MCP</text>
    </g>
    <g transform="translate(60,440)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node primary" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">Claude Code / IDE</text>
      <text class="sub" x="100" y="44">.mcp.json · config.toml</text>
    </g>
    <g transform="translate(380,140)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node bus" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">tools</text>
      <text class="sub" x="100" y="44">名字 · 参数 · description</text>
    </g>
    <g transform="translate(380,240)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node bus" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">annotations</text>
      <text class="sub" x="100" y="44">readOnlyHint 等读写标注</text>
    </g>
    <g transform="translate(380,340)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node bus" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">传输</text>
      <text class="sub" x="100" y="44">stdio 本地 · Streamable HTTP 远程</text>
    </g>
    <g transform="translate(380,440)">
      <rect class="mask" width="200" height="60" rx="6"/>
      <rect class="node bus" width="200" height="60" rx="6"/>
      <text class="label" x="100" y="26">鉴权</text>
      <text class="sub" x="100" y="44">OAuth · bearer token</text>
    </g>
    <g transform="translate(700,250)">
      <rect class="mask" width="200" height="80" rx="6"/>
      <rect class="node secondary" width="200" height="80" rx="6"/>
      <text class="label" x="100" y="30">你的 MCP server</text>
      <text class="sub" x="100" y="48">一个进程或一个 HTTPS 端点</text>
      <text class="sub" x="100" y="64">把业务操作声明成 tools</text>
    </g>
    <g transform="translate(960,200)">
      <rect class="mask" y="10" width="120" height="50"/>
      <ellipse class="mask" cx="60" cy="10" rx="60" ry="10"/>
      <ellipse class="mask" cx="60" cy="60" rx="60" ry="10"/>
      <rect class="node data" y="10" width="120" height="50" stroke="none"/>
      <ellipse class="node data" cx="60" cy="60" rx="60" ry="10"/>
      <ellipse class="node data" cx="60" cy="10" rx="60" ry="10"/>
      <line class="node data" x1="0" y1="10" x2="0" y2="60"/>
      <line class="node data" x1="120" y1="10" x2="120" y2="60"/>
      <text class="label" x="60" y="42">工单系统</text>
    </g>
    <g transform="translate(960,300)">
      <rect class="mask" y="10" width="120" height="50"/>
      <ellipse class="mask" cx="60" cy="10" rx="60" ry="10"/>
      <ellipse class="mask" cx="60" cy="60" rx="60" ry="10"/>
      <rect class="node data" y="10" width="120" height="50" stroke="none"/>
      <ellipse class="node data" cx="60" cy="60" rx="60" ry="10"/>
      <ellipse class="node data" cx="60" cy="10" rx="60" ry="10"/>
      <line class="node data" x1="0" y1="10" x2="0" y2="60"/>
      <line class="node data" x1="120" y1="10" x2="120" y2="60"/>
      <text class="label" x="60" y="42">员工目录</text>
    </g>
    <g transform="translate(960,400)">
      <rect class="mask" y="10" width="120" height="50"/>
      <ellipse class="mask" cx="60" cy="10" rx="60" ry="10"/>
      <ellipse class="mask" cx="60" cy="60" rx="60" ry="10"/>
      <rect class="node data" y="10" width="120" height="50" stroke="none"/>
      <ellipse class="node data" cx="60" cy="60" rx="60" ry="10"/>
      <ellipse class="node data" cx="60" cy="10" rx="60" ry="10"/>
      <line class="node data" x1="0" y1="10" x2="0" y2="60"/>
      <line class="node data" x1="120" y1="10" x2="120" y2="60"/>
      <text class="label" x="60" y="42">知识库</text>
    </g>
  </g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
    <g transform="translate(40,690)">
      <rect class="node primary" width="14" height="14" rx="3"/>
      <text class="legend" x="20" y="11">AI 客户端</text>
      <rect class="node bus" x="120" width="14" height="14" rx="3"/>
      <text class="legend" x="140" y="11">MCP 协议要素</text>
      <rect class="node secondary" x="260" width="14" height="14" rx="3"/>
      <text class="legend" x="280" y="11">MCP server（connector 本体）</text>
      <rect class="node data" x="480" width="14" height="14" rx="3"/>
      <text class="legend" x="500" y="11">内部系统</text>
    </g>
    <text class="caption" x="600" y="590">线上客户端只接受公网 HTTPS；本机 HTTP 只有 Claude Code、Codex CLI 这类本地客户端能连</text>
  </g>
</svg>
